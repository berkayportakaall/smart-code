<script>
/* SMART CODE motoru, surum 2 (Python engine.py ile ayni kurallar) */
const SC_N = 8, SC_DX = [0, 1, 0, -1], SC_DY = [-1, 0, 1, 0];
function scInb(x, y) { return x >= 0 && x < SC_N && y >= 0 && y < SC_N; }
function scRun(P) {
  const key = (x, y) => x + ',' + y;
  const walls = new Set(P.w.map(c => key(c[0], c[1])));
  const pits = new Set(P.p.map(c => key(c[0], c[1])));
  const cidx = new Map(P.c.map((c, i) => [key(c[0], c[1]), i]));
  const call = (1 << P.c.length) - 1;
  const full = P.prog.reduce((n, l) => n + (l[0] === 'A' ? 1 : 2), 0);
  let x = P.s[0], y = P.s[1], d = P.s[2], cm = 0, ran = 0;
  const steps = [];
  for (let pc = 0; pc < P.prog.length; pc++) {
    const l = P.prog[pc];
    let act, cond = null;
    ran++;
    if (l[0] === 'A') act = l[1];
    else {
      const fx = x + SC_DX[d], fy = y + SC_DY[d];
      cond = l[1] === 'W' ? (!scInb(fx, fy) || walls.has(key(fx, fy))) : (scInb(fx, fy) && pits.has(key(fx, fy)));
      act = cond ? l[2] : null;
      if (act) ran++;
    }
    const step = { pc, cond, act, from: [x, y, d] };
    let status = null;
    if (act === 'R') d = (d + 1) % 4;
    else if (act === 'L') d = (d + 3) % 4;
    else if (act === 'F' || act === 'B') {

    const inv = { F: 0, B: 0, R: 0, L: 0, W: 0, P: 0 };

      else { inv[l[1]]++; inv[l[2]]++; }

    let s = `<svg viewBox="0 0 ${SIZE} ${SIZE}" role="img" aria-label="8 x 8 oyun tahtası kurulumu" xmlns="http://www.w3.org/2000/svg">`;
    for (let i = 0; i < 8; i++) {
      s += `<text x="${cx(i)}" y="14" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="var(--muted)">${COLS[i]}</text>`;
      s += `<text x="10" y="${cy(i) + 4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="var(--muted)">${i + 1}</text>`;
    }
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      s += `<rect x="${OX + x * CS}" y="${OY + y * CS}" width="${CS}" height="${CS}" fill="${(x + y) % 2 ? 'var(--cell-alt)' : 'var(--cell)'}" stroke="var(--grid)" stroke-width="1"/>`;
    }
    s += `<rect x="${OX}" y="${OY}" width="${CS * 8}" height="${CS * 8}" fill="none" stroke="var(--brand)" stroke-width="2.5" rx="2"/>`;
    s += startSVG(P.s[0], P.s[1], P.s[2]);
    s += goalSVG(P.g[0], P.g[1]);
    P.w.forEach(c => s += wallSVG(c[0], c[1]));
    P.p.forEach(c => s += pitSVG(c[0], c[1]));
    P.c.forEach((c, i) => s += crySVG(c[0], c[1], i));
    s += `<polyline id="trail" points="" fill="none" stroke="var(--trail)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`;
    s += `<g class="robot" id="robot"><circle r="15" fill="var(--robot)"/><path d="M0 -10 L8 5 L0 1 L-8 5 Z" fill="var(--robot-ink)"/></g>`;
    s += `</svg>`;
    return s;
  }
  function legendIcon(kind) {
    const v = 'viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"';
    if (kind === 'wall') return `<svg ${v}><rect x="2" y="2" width="20" height="20" rx="4" fill="var(--wall)"/><path d="M2 9h20M2 15h20M12 2v7M7 9v6M17 9v6M12 15v7" stroke="var(--wall-line)" stroke-width="1.2" fill="none"/></svg>`;
    if (kind === 'pit') return `<svg ${v}><circle cx="12" cy="12" r="9" fill="var(--pit)" stroke="var(--pit-rim)" stroke-width="2.5"/></svg>`;
    if (kind === 'cry') return `<svg ${v}><polygon points="12,2 20,10 12,22 4,10" fill="var(--cry)"/></svg>`;
    if (kind === 'goal') return `<svg ${v}><rect x="2" y="2" width="20" height="20" rx="4" fill="var(--stop-bg)" stroke="var(--stop)" stroke-width="1.6"/><path d="M8 19V5" stroke="var(--stop)" stroke-width="2" stroke-linecap="round"/><path d="M9 5l9 3.5L9 12Z" fill="var(--stop)"/></svg>`;
    if (kind === 'start') return `<svg ${v}><rect x="2" y="2" width="20" height="20" rx="4" fill="var(--go-bg)" stroke="var(--go)" stroke-width="1.6" stroke-dasharray="3 2"/><circle cx="12" cy="12" r="6" fill="var(--robot)"/></svg>`;
    return '';
  }

  /* ---------- ana sayfa ---------- */
  function solvedCount() { return Object.keys(stars).filter(k => stars[k] > 0).length; }
  function topBar() {
    const n = solvedCount();
    return `<header class="top"><div class="wrap">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="brand"><b>SMART CODE</b><span>Veli rehberi · 8×8 kodlama oyunu</span></div>
      <div class="spacer"></div>
      <div class="progress" aria-label="${n} bulmaca çözüldü"><div class="bar"><i style="width:${n}%"></i></div><span class="mono">${n}/100</span></div>
    </div></header>`;
  }
  /* ---------- telefona yukleme (yalnizca web sitesi surumunde) ---------- */
  let deferredPrompt = null;
  const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function installHTML() {
    if (!SITE || isStandalone()) return '<span id="install" hidden></span>';
    let body, btn = '';
    if (deferredPrompt) {
      body = 'Ana ekranınıza SMART CODE simgesi gelir. Uygulama gibi tam ekran açılır, internet olmadan da çalışır.';
      btn = '<button class="btn primary" id="install-btn">Telefona yükle</button>';
    } else if (isIOS) {
      body = "Safari'de alttaki <b>Paylaş</b> düğmesine dokunun, sonra <b>Ana Ekrana Ekle</b>'yi seçin. Simge ana ekranınıza gelir.";
    } else {
      body = "Tarayıcının <b>⋮</b> menüsünden <b>Uygulamayı yükle</b> ya da <b>Ana ekrana ekle</b>'yi seçin. Simge ana ekranınıza gelir.";
    }
    return `<section class="install" id="install"><div><b>Telefona uygulama olarak ekleyin</b><p>${body}</p></div>${btn}</section>`;
  }
  function bindInstall() {
    const b = document.getElementById('install-btn');
    if (b) b.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      refreshInstall();
    };
  }
  function refreshInstall() {
    const el = document.getElementById('install');
    if (!el) return;
    el.outerHTML = installHTML();
    bindInstall();
  }
  if (SITE) {
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; refreshInstall(); });
    window.addEventListener('appinstalled', () => { deferredPrompt = null; refreshInstall(); });
    if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  function renderHome(scrollRules) {
    const L = LV[tab];
    const tile = id => {
      const s = stars[id] || 0;
      return `<button class="lvl${s ? ' done' : ''}" data-id="${id}" aria-label="Bulmaca ${id}${s ? ', ' + s + ' yıldız' : ''}">
        <span class="num">${id}</span>
        <span class="st" aria-hidden="true">${[1, 2, 3].map(i => `<span class="${i <= s ? 'on' : ''}">★</span>`).join('')}</span></button>`;
    };
    const chs = CHAPTERS.filter(c => c.level === tab);
    let tiles = '<div class="chaps">';
    chs.forEach((c, i) => {
      let g = '', done = 0;
      for (let id = c.from; id <= c.to; id++) { g += tile(id); if (stars[id]) done++; }
      const n = c.to - c.from + 1;
      tiles += `<section class="chap" aria-label="Bölüm ${i + 1}: ${esc(c.name)}">
        <div class="chap-h"><span class="chap-no" aria-hidden="true">${i + 1}</span>
          <div><b>${esc(c.name)}</b><span class="g">${esc(c.goal)}</span></div>
          <span class="chap-r${done === n ? ' done' : ''}">${done}/${n}</span></div>
        <div class="grid">${g}</div></section>`;
    });
    tiles += '</div>';
    app.innerHTML = topBar() + `<main class="wrap home">
      ${installHTML()}
      <p class="lead"><strong>Bir bulmaca seçin.</strong> Ekrandaki gibi tahtayı kurun, çocuğa yalnızca listedeki parçaları verin. Çocuk programını akış panosuna dizip piyonu yürütsün; çözüm sizin telefonunuzda kalsın.</p>
      <div class="tabs" role="tablist" aria-label="Zorluk">
        ${LV.map((l, i) => `<button class="tab ${l.key}" role="tab" aria-selected="${i === tab}" data-tab="${i}"><b>${l.name}</b><span class="mono">${l.from}–${l.to}</span></button>`).join('')}
      </div>
      <p class="tabnote">${L.note}</p>
      ${tiles}
      ${rulesHTML()}
      ${SITE ? '<div class="footlinks"><a class="btn" href="#qr">Tahta için QR etiketi</a></div>' : ''}
    </main>`;
    app.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = +b.dataset.tab; try { localStorage.setItem(TKEY, tab); } catch (e) {} renderHome(); });
    app.querySelectorAll('.lvl').forEach(b => b.onclick = () => { location.hash = 'b' + b.dataset.id; });
    bindInstall();
    if (scrollRules) { const r = document.getElementById('kurallar'); if (r) r.scrollIntoView(); } else window.scrollTo(0, 0);
  }
  function rulesHTML() {
    return `<section class="rules" id="kurallar">
      <h2>Nasıl oynanır?</h2>
      <ol>
        <li><b>Tahtayı kurun.</b> Bulmacadaki duvar, çukur, BAŞLA ve HEDEF parçalarını gösterilen karelere koyun. Piyonu BAŞLA karesine, okun yönüne bakacak şekilde yerleştirin.</li>
        <li><b>Parçaları verin.</b> Çocuğa yalnızca listedeki komut parçalarını verin. Başka parça yok.</li>
        <li><b>Program önce kurulur.</b> Çocuk parçaları akış panosuna yukarıdan aşağı dizer. Program bitmeden piyona dokunulmaz.</li>
        <li><b>Çalıştırın.</b> Satırları yukarıdan aşağı, sırayla bir kez uygulayın. EĞER satırında piyonun önündeki kareye bakın.</li>
        <li><b>Hata ayıklama.</b> Piyon duvara çarparsa, tahtadan çıkarsa ya da çukura düşerse BAŞLA'ya döner; çocuk programını düzeltip yeniden dener.</li>
      </ol>
      <div class="cols">
        <div><h3>Kurallar</h3>
          <ol>
            <li>Verilen parçaların <b>hepsi</b> kullanılır.</li>
            <li>EĞER'in <b>EVET</b> tarafına tek bir parça konur. Cevap EVET ise o parça çalışır; HAYIR ise hiçbir şey yapılmaz, sonraki satıra geçilir.</li>
            <li>Piyon hedefe vardığında her parça çalışmış olmalı. EĞER'in içindeki parça çalışmadıysa (EĞER yanlış yere konduysa) çözüm geçersizdir.</li>
            <li>Piyon hedefe vardığı an oyun biter.</li>
            <li><b>İpucu:</b> Doğru yol her zaman tahtadaki en kısa yoldur: en az kare, eşitse en az dönüş.</li>
            <li><b>İpucu:</b> Önünde duvar ya da çukur varken dönülecekse EĞER kartı kullanılır; normal SAĞA DÖN / SOLA DÖN kartları yalnızca piyonun önü açıkken kullanılır.</li>
          </ol>
        </div>
        <div><h3>Parçalar</h3>
          <div class="legend">
            <div>${actTile('F')}<span>Baktığı yöne 1 kare gider.</span></div>
            <div>${actTile('R')}<span>Olduğu yerde 90° sağa döner, kare değiştirmez.</span></div>
            <div>${actTile('L')}<span>Olduğu yerde 90° sola döner, kare değiştirmez.</span></div>
            <div>${ifTile('W')}<span>Önündeki kare duvar mı? Tahtanın kenarı da duvar sayılır.</span></div>
            <div>${ifTile('P')}<span>Önündeki kare çukur mu?</span></div>
          </div>
        </div>
        <div><h3>Tahta parçaları</h3>
          <div class="legend">
            <div>${legendIcon('start')}<span><b>BAŞLA</b>: piyonun ilk karesi, ok baktığı yönü gösterir.</span></div>
            <div>${legendIcon('goal')}<span><b>HEDEF</b>: piyonun varması gereken kare.</span></div>
            <div>${legendIcon('wall')}<span><b>Duvar</b>: geçilmez. Tahtanın kenarı da duvar gibidir.</span></div>
            <div>${legendIcon('pit')}<span><b>Çukur</b>: üstüne basan piyon düşer.</span></div>
          </div>
        </div>
      </div>
    </section>`;
  }

  /* ---------- bulmaca sayfasi ---------- */
  let cur = null; // {P, run, k, mode, timer, angles}
  function renderPuzzle(id) {
    const P = DATA[id - 1];
    const lv = LV[levelOf(id)];
    const inv = inventory(P);
    const run = scRun(P);
    // acilar (donuslerde dogru yone animasyon icin)
    const angles = [P.s[2] * 90];
    run.steps.forEach(st => {
      const a = angles[angles.length - 1];
      angles.push(st.act === 'R' ? a + 90 : st.act === 'L' ? a - 90 : a);
    });
    stopTimer();
    cur = { P, run, k: 0, mode: 'locked', angles, id };

    const dir = DIRS[P.s[2]];
    let place = `<div class="row"><span class="lab">${legendIcon('start')}BAŞLA</span><div class="coords"><span class="co">${co(P.s)}</span><span class="dirnote">${dir.ar} ${dir.tr}</span></div></div>`;
    place += `<div class="row"><span class="lab">${legendIcon('goal')}HEDEF</span><div class="coords"><span class="co">${co(P.g)}</span></div></div>`;
    if (P.w.length) place += `<div class="row"><span class="lab">${legendIcon('wall')}Duvar ×${P.w.length}</span><div class="coords">${sortCells(P.w).map(c => `<span class="co">${co(c)}</span>`).join('')}</div></div>`;
    if (P.p.length) place += `<div class="row"><span class="lab">${legendIcon('pit')}Çukur ×${P.p.length}</span><div class="coords">${sortCells(P.p).map(c => `<span class="co">${co(c)}</span>`).join('')}</div></div>`;
    if (P.c.length) place += `<div class="row"><span class="lab">${legendIcon('cry')}Kristal ×${P.c.length}</span><div class="coords">${sortCells(P.c).map(c => `<span class="co">${co(c)}</span>`).join('')}</div></div>`;

    const items = [];
    ['F', 'R', 'L'].forEach(a => { if (inv[a]) items.push(`<span class="item">${actTile(a)}<span class="x">×${inv[a]}</span></span>`); });
    ['W', 'P'].forEach(c => { if (inv[c]) items.push(`<span class="item">${ifTile(c)}<span class="x">×${inv[c]}</span></span>`); });
    const total = inv.F + inv.B + inv.R + inv.L + inv.W + inv.P;
    const nIf = inv.W + inv.P;
    let rem = `<span>Toplam <b>${total}</b> parça. Hepsi kullanılacak.</span>`;
    if (nIf) rem += `<span>${nIf === 1 ? 'EĞER parçası' : 'Her EĞER parçası'} yalnızca önünde gerçekten ${inv.W && inv.P ? 'duvar ya da çukur' : inv.W ? 'duvar' : 'çukur'} olan yerde işe yarar. EVET tarafına konan parça orada çalışır.</span>`;
    if (P.c.length) rem += `<span>Önce ${P.c.length === 1 ? 'kristal' : 'bütün kristaller'} toplanır, sonra hedef açılır.</span>`;

    const s = stars[id] || 0;
    app.innerHTML = `<header class="bar"><div class="wrap">
        <button class="back" id="back" aria-label="Bulmaca listesine dön">← <span>Liste</span></button>
        <h1>Bulmaca <span class="mono">${id}</span> <span class="chip ${lv.key}">${lv.name}</span></h1>
        <div class="spacer"></div>
        <div class="nav"><button id="prev" aria-label="Önceki bulmaca" ${id <= 1 ? 'disabled' : ''}>‹</button><button id="next" aria-label="Sonraki bulmaca" ${id >= 100 ? 'disabled' : ''}>›</button></div>
      </div></header>
      <main class="wrap puzzle">
        <div class="col-board">
          <div class="boardbox">${boardSVG(P)}</div>
          <div class="play" id="play" hidden>
            <div class="btns">
              <button class="btn primary" id="pplay">▶ Oynat</button>
              <button class="btn" id="pprev" aria-label="Bir adım geri">‹ Geri</button>
              <button class="btn" id="pnext" aria-label="Bir adım ileri">İleri ›</button>
              <button class="btn" id="preset">Başa al</button>
            </div>
            <div class="status" id="status" aria-live="polite"></div>
          </div>
        </div>
        <div class="col-info">
          ${chapLine(id)}
          <section class="card"><h2><span class="stepno">1</span>Tahtayı kurun</h2><div class="place">${place}</div></section>
          <section class="card"><h2><span class="stepno">2</span>Çocuğa bu parçaları verin</h2>
            <div class="inv">${items.join('')}</div>
            <div class="remind">${rem}</div>
          </section>
          <section class="card"><h2><span class="stepno">3</span>Çözüm</h2><div id="sol"></div></section>
          <section class="card"><h2>Nasıl gitti?</h2>
            <div class="stars" role="group" aria-label="Sonucu işaretleyin">
              ${[[3, 'İlk denemede çözdü'], [2, '1–2 düzeltmeyle çözdü'], [1, 'Yardımla çözdü']].map(([n, t]) =>
                `<button class="starbtn" data-s="${n}" aria-pressed="${s === n}"><span class="s">${'★'.repeat(n)}</span><small>${t}</small></button>`).join('')}
            </div>
            <div class="nextrow">${id < 100 ? `<button class="btn" id="go-next">Sonraki bulmaca: ${id + 1} ›</button>` : ''}<button class="btn" id="go-list">Listeye dön</button></div>
          </section>
        </div>
      </main>`;
    document.getElementById('back').onclick = () => { location.hash = ''; };
    document.getElementById('go-list').onclick = () => { location.hash = ''; };
    const gn = document.getElementById('go-next'); if (gn) gn.onclick = () => { location.hash = 'b' + (id + 1); };
    document.getElementById('prev').onclick = () => { if (id > 1) location.hash = 'b' + (id - 1); };
    document.getElementById('next').onclick = () => { if (id < 100) location.hash = 'b' + (id + 1); };
    app.querySelectorAll('.starbtn').forEach(b => b.onclick = () => {
      const n = +b.dataset.s;
      if (stars[id] === n) delete stars[id]; else stars[id] = n;
      saveStars();
      app.querySelectorAll('.starbtn').forEach(x => x.setAttribute('aria-pressed', String(stars[id] === +x.dataset.s)));
    });
    renderSolution();
    setPose(0, true);
    window.scrollTo(0, 0);
  }

  function chapterOf(id) { return CHAPTERS.find(c => id >= c.from && id <= c.to); }
  function chapLine(id) {
    const c = chapterOf(id);
    if (!c) return '';
    const no = CHAPTERS.filter(x => x.level === c.level).indexOf(c) + 1;
    return `<p class="chapline"><b>Bölüm ${no} · ${esc(c.name)}</b><span>${esc(c.goal)}</span><span class="mono">${id - c.from + 1}/${c.to - c.from + 1}</span></p>`;
  }

  function flowHTML(P, upto) {
    // upto: kac satir gorunur (Infinity = hepsi)
    let h = `<ol class="flow" id="flow"><li class="cap"><span class="n"></span><span>${'<span class="tile go">BAŞLA</span>'}</span></li>`;
    P.prog.forEach((l, i) => {
      if (i >= upto) { h += `<li><span class="n">${i + 1}</span><div class="hidden-line" aria-label="gizli satır"></div></li>`; return; }
      if (l[0] === 'A') {
        h += `<li data-pc="${i}"><span class="n">${i + 1}</span><span>${actTile(l[1])}</span></li>`;
      } else {
        h += `<li data-pc="${i}"><span class="n">${i + 1}</span><div class="ifbox">
          <div class="q"><span class="dia" aria-hidden="true"></span>EĞER ${COND[l[1]]}</div>
          <div class="arms">
            <div class="arm yes" data-arm="yes"><span class="al">◄ EVET</span>${actTile(l[2])}</div>
            <div class="arm no" data-arm="no"><span class="al">HAYIR ►</span><span class="tile empty">hiçbir şey yapma</span></div>
          </div></div></li>`;
      }
    });
    if (upto >= P.prog.length) {
      h += `<li class="cap"><span class="n"></span><span><span class="tile stop">BİTİR</span></span></li>`;
    }
    return h + '</ol>';
  }

  function renderSolution() {
    const box = document.getElementById('sol');
    const P = cur.P;
    const play = document.getElementById('play');
    if (cur.mode === 'locked') {
      play.hidden = true;
      box.innerHTML = `<div class="lock">
        <p class="muted">Çözüm gizli. Çocuk takılırsa önce ipucu verin: "Hedefe en kısa yoldan git" deyin ya da aşağıdan programın kaç satır olduğunu ve ilk satırı gösterin.</p>
        <div class="btns"><button class="btn" id="hint">İpucu göster</button><button class="btn warn" id="reveal">Çözümü göster</button></div></div>`;
      document.getElementById('hint').onclick = () => { cur.mode = 'hint'; renderSolution(); };
      document.getElementById('reveal').onclick = () => { cur.mode = 'confirm'; renderSolution(); };
    } else if (cur.mode === 'hint') {
      play.hidden = true;
      box.innerHTML = `<p class="muted">Piyon hedefe en kısa yoldan, <b>${P.mv} kare</b> yürüyerek gider. Program <b>${P.prog.length} satır</b>. İlk satır:</p>${flowHTML(P, 1)}
        <div class="lock"><div class="btns"><button class="btn warn" id="reveal">Tüm çözümü göster</button><button class="btn" id="hide">Gizle</button></div></div>`;
      document.getElementById('reveal').onclick = () => { cur.mode = 'confirm'; renderSolution(); };
      document.getElementById('hide').onclick = () => { cur.mode = 'locked'; renderSolution(); };
    } else if (cur.mode === 'confirm') {
      play.hidden = true;
      box.innerHTML = `<div class="confirm"><p><b>Çocuk kendisi denedi mi?</b> Çözümü görünce bulmacanın tadı kaçar. Ekranı çocuktan uzak tutun.</p>
        <div class="lock"><div class="btns"><button class="btn warn" id="yes">Evet, göster</button><button class="btn" id="no">Vazgeç</button></div></div></div>`;
      document.getElementById('yes').onclick = () => { cur.mode = 'open'; renderSolution(); };
      document.getElementById('no').onclick = () => { cur.mode = 'locked'; renderSolution(); };
    } else {
      play.hidden = false;
      box.innerHTML = `<p class="muted">Bu bulmacanın tek doğru çözümü var. Oynat'a basın; piyon tahtada adım adım yürür, çalışan satır işaretlenir.</p>${flowHTML(P, Infinity)}
        <div><button class="btn" id="hide">Çözümü gizle</button></div>`;
      document.getElementById('hide').onclick = () => { stopTimer(); cur.mode = 'locked'; setPose(0, true); renderSolution(); };
      document.getElementById('pplay').onclick = togglePlay;
      document.getElementById('pnext').onclick = () => { stopTimer(); step(1); };
      document.getElementById('pprev').onclick = () => { stopTimer(); step(-1); };
      document.getElementById('preset').onclick = () => { stopTimer(); setPose(0, true); };
      setPose(cur.k, true);
    }
  }

  function setPose(k, instant) {
    const { P, run, angles } = cur;
    cur.k = k;
    const robot = document.getElementById('robot');
    if (!robot) return;
    const pos = k === 0 ? P.s : run.steps[k - 1].to;
    if (instant) robot.style.transition = 'none';
    robot.style.transform = `translate(${cx(pos[0])}px, ${cy(pos[1])}px) rotate(${angles[k]}deg)`;
    if (instant) { robot.getBoundingClientRect(); robot.style.transition = ''; }
    // kristaller
    const cm = k === 0 ? 0 : run.steps[k - 1].cm;
    P.c.forEach((c, i) => { const el = document.getElementById('cry' + i); if (el) el.style.opacity = (cm >> i) & 1 ? '0.18' : '1'; });
    // iz
    const pts = [[P.s[0], P.s[1]]];
    for (let i = 0; i < k; i++) { const t = run.steps[i].to; const l = pts[pts.length - 1]; if (t[0] !== l[0] || t[1] !== l[1]) pts.push([t[0], t[1]]); }
    const tr = document.getElementById('trail');
    if (tr) tr.setAttribute('points', pts.map(p => cx(p[0]) + ',' + cy(p[1])).join(' '));
    // akis vurgusu
    const flow = document.getElementById('flow');
    if (flow) {
      flow.querySelectorAll('li.now').forEach(li => li.classList.remove('now'));
      flow.querySelectorAll('.arm.hit').forEach(a => a.classList.remove('hit'));
      if (k > 0 && cur.mode === 'open') {
        const st = run.steps[k - 1];
        const li = flow.querySelector(`li[data-pc="${st.pc}"]`);
        if (li) {
          li.classList.add('now');
          if (st.cond !== null) { const a = li.querySelector(`.arm[data-arm="${st.cond ? 'yes' : 'no'}"]`); if (a) a.classList.add('hit'); }
        }
      }
    }
    updateStatus();
  }

  function updateStatus() {
    const el = document.getElementById('status');
    if (!el || cur.mode !== 'open') return;
    const { P, run, k } = cur;
    const n = run.steps.length;
    const btnPrev = document.getElementById('pprev'), btnNext = document.getElementById('pnext');
    if (btnPrev) btnPrev.disabled = k === 0;
    if (btnNext) btnNext.disabled = k >= n;
    const pb = document.getElementById('pplay');
    if (pb) pb.textContent = cur.timer ? '❚❚ Durdur' : (k >= n ? '▶ Baştan oynat' : '▶ Oynat');
    if (k === 0) { el.innerHTML = `<span class="counter">Adım 0/${n}</span><br>Piyon <b>${co(P.s)}</b> karesinde, ${DIRS[P.s[2]].tr}.`; return; }
    const st = run.steps[k - 1];
    const l = P.prog[st.pc];
    let what;
    if (l[0] === 'A') what = `<b>${ACT[st.act].name}</b>`;
    else {
      what = `EĞER ${COND[l[1]]} → <b>${st.cond ? 'EVET' : 'HAYIR'}</b> → ` + (st.act ? `<b>${ACT[st.act].name}</b>` : 'hiçbir şey yapılmadı');
    }
    let tail = '';
    if (st.collect !== undefined) tail = ` Kristal toplandı.`;
    if (k === n && run.status === 'ok') tail += ` <span class="ok">Hedefe vardı, bütün parçalar çalıştı.</span>`;
    el.innerHTML = `<span class="counter">Adım ${k}/${n} · ${st.pc + 1}. satır</span><br>${what}. Piyon <b>${co(st.to)}</b>.${tail}`;
  }

  function step(delta) {
    const n = cur.run.steps.length;
    const k = Math.max(0, Math.min(n, cur.k + delta));
    setPose(k, false);
  }
  function stopTimer() { if (cur && cur.timer) { clearInterval(cur.timer); cur.timer = null; } if (cur) updateStatus(); }
  function togglePlay() {
    if (cur.timer) { stopTimer(); return; }
    const n = cur.run.steps.length;
    if (cur.k >= n) setPose(0, true);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    cur.timer = setInterval(() => {
      if (cur.k >= cur.run.steps.length) { stopTimer(); return; }
      step(1);
      if (cur.k >= cur.run.steps.length) stopTimer();
    }, reduce ? 900 : 650);
    updateStatus();
  }

  /* ---------- QR etiketi sayfasi (yalnizca web sitesinde) ---------- */
  function labelHTML(kind, qr) {
    return `<div class="label ${kind}"><div class="lh"><div class="lm" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="lt"><b>SMART CODE</b><span>Veli rehberi · 100 bulmaca</span></div></div>
      <div class="lq">${qr}</div>
      <div class="lf"><b>Telefon kamerasıyla okutun</b><span>Kolay · Orta · Zor · kurulum ve çözümler</span></div></div>`;
  }
  function renderQR() {
    stopTimer(); cur = null;
    const url = location.origin + location.pathname;
    const local = !/^https?:$/.test(location.protocol);
    let qr = '';
    try { qr = SC_QR.svg(url); } catch (e) { qr = '<p>QR üretilemedi.</p>'; }
    app.innerHTML = `<header class="bar noprint"><div class="wrap">
        <button class="back" id="back" aria-label="Bulmaca listesine dön">← <span>Liste</span></button>
        <h1>QR etiketi</h1><div class="spacer"></div>
        <button class="btn primary" id="print">Yazdır</button>
      </div></header>
      <main class="wrap qrpage">
        <p class="muted noprint">Bu QR, sitenin şu anki adresini açar: <span class="mono url">${esc(url)}</span><br>Yazdırın, çerçeveden kesin ve tahtanın arkasına yapıştırın. Büyük etiket 10 × 12 cm, küçükler 6 × 7,2 cm.</p>
        ${local ? '<p class="warnbox noprint">Bu sayfa bilgisayardaki bir dosyadan açıldı; bu QR telefonda çalışmaz. Siteyi GitHub Pages\'e yükleyin ve etiketi oradan yazdırın.</p>' : ''}
        <div class="labels">${labelHTML('big', qr)}${labelHTML('small', qr)}${labelHTML('small', qr)}</div>
      </main>`;
    document.getElementById('back').onclick = () => { location.hash = ''; };
    document.getElementById('print').onclick = () => { try { window.print(); } catch (e) {} };
    window.scrollTo(0, 0);
  }

  /* ---------- yonlendirme ---------- */
  function route() {
    const h = (location.hash || '').replace('#', '');
    const m = /^b(\d{1,3})$/.exec(h);
    if (m && +m[1] >= 1 && +m[1] <= 100) { const id = +m[1]; tab = levelOf(id); renderPuzzle(id); }
    else if (h === 'qr' && SITE) renderQR();
    else { stopTimer(); cur = null; renderHome(h === 'kurallar'); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
